name: Lint and test

# Slimmed-down CI for the iDared 32bit fork: formatting, lint (clippy) and the
# test suite only. This fork does not build or publish desktop/Android binary
# artifacts (its release is the iOS app), so no build/bundle/upload steps.

on:
  push:
    branches: [ "idared32bit", "ci/unsigned-ipa-baseline", "phase2/persistent-cold-start-index" ]
  pull_request:
    branches: [ "idared32bit" ]
  workflow_dispatch:
    inputs:
      native_reference_only:
        description: Run only the native Foundation contract reference
        type: boolean
        default: false
      force_preflight_failure:
        description: Test the preflight gate without starting an IPA
        type: boolean
        default: false
      build_ipa:
        description: Build an IPA after a successful manual preflight
        type: boolean
        default: false
      cold_cargo_cache:
        description: Bypass Cargo cache restore/save for a diagnostic cold run
        type: boolean
        default: false
      artifact_role:
        description: Artifact role when build_ipa is enabled
        type: choice
        options:
          - replacement
          - lifecycle-diagnostic
        default: replacement

# A newer ordinary development commit supersedes every job from an older one,
# including queued/running preflight, IPA, Windows and Android work. Manual and
# release-oriented runs receive unique groups and are never auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/ci/unsigned-ipa-baseline' || github.ref == 'refs/heads/phase2/persistent-cold-start-index') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  candidate-scope:
    name: Identify workflow-only setup commits
    if: ${{ !inputs.native_reference_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workflow_only: ${{ steps.scope.outputs.workflow_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Classify candidate scope conservatively
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          workflow_only=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
            fi
            if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
              if (( ${#changed_files[@]} > 0 )); then
                workflow_only=true
                for path in "${changed_files[@]}"; do
                  if [[ "$path" != .github/workflows/* ]]; then
                    workflow_only=false
                    break
                  fi
                done
              fi
            fi
          fi
          echo "workflow_only=$workflow_only" | tee -a "$GITHUB_OUTPUT"

  fast-preflight-macos:
    name: Fast macOS preflight
    if: ${{ !inputs.native_reference_only && (github.ref == 'refs/heads/ci/unsigned-ipa-baseline' || github.ref == 'refs/heads/phase2/persistent-cold-start-index') }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target/host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1
      - name: Verify the exact candidate commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Exercise the failure gate when explicitly requested
        if: ${{ inputs.force_preflight_failure }}
        run: |
          echo "Intentional preflight-gate test: the IPA job must remain skipped."
          exit 1
      - name: Identify the host Rust cache boundary
        id: host-rust
        run: |
          set -euo pipefail
          rust_release="$(rustc -vV | awk '/^release:/ { print $2 }')"
          test -n "$rust_release"
          echo "release=$rust_release" | tee -a "$GITHUB_OUTPUT"
      - name: Start host Cargo cache restore timer
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cold_cargo_cache }}
        run: echo "HOST_CACHE_RESTORE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Restore host Cargo cache
        id: host-cache-restore
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cold_cargo_cache }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target/host
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.host-rust.outputs.release }}-x86_64-apple-darwin-test-default-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.host-rust.outputs.release }}-x86_64-apple-darwin-test-default-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', '.cargo/config.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.host-rust.outputs.release }}-x86_64-apple-darwin-test-default-
      - name: Report host Cargo cache restore
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.cold_cargo_cache) }}
        env:
          CACHE_HIT: ${{ steps.host-cache-restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.host-cache-restore.outputs.cache-matched-key }}
          PRIMARY_KEY: ${{ steps.host-cache-restore.outputs.cache-primary-key }}
          RESTORE_OUTCOME: ${{ steps.host-cache-restore.outcome }}
        run: |
          set -euo pipefail
          elapsed=$(($(date +%s) - HOST_CACHE_RESTORE_STARTED_AT))
          if [[ "$RESTORE_OUTCOME" != "success" ]]; then
            status="restore-error (cold recovery)"
            rm -rf "$CARGO_TARGET_DIR" "$HOME/.cargo/registry" "$HOME/.cargo/git"
          elif [[ "$CACHE_HIT" == "true" ]]; then
            status="exact-hit"
          elif [[ -n "$MATCHED_KEY" ]]; then
            status="restore-prefix-hit"
          else
            status="miss"
          fi
          echo "Host Cargo cache: $status; restore ${elapsed}s"
          echo "Requested key: $PRIMARY_KEY"
          echo "Matched key: ${MATCHED_KEY:-<none>}"
          {
            echo "### Host Cargo cache restore"
            echo "- Status: $status"
            echo "- Duration: ${elapsed}s"
            echo "- Requested: \`$PRIMARY_KEY\`"
            echo "- Matched: \`${MATCHED_KEY:-<none>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore CMake 3.31.6
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: vendor/cmake
          key: cmake_3_31_6_macos
      - name: Download CMake 3.31.6
        if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
      - name: Extract CMake 3.31.6
        if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        run: tar xzvf "cmake-3.31.6-macos-universal.tar.gz" -C vendor && mv "vendor/cmake-3.31.6-macos-universal/CMake.app/Contents/" vendor/cmake && rm -rf vendor/cmake-3.31.6-macos-universal
      - name: Restore LLVM 12
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: tests/llvm
          key: llvm_12_0_0_macOS_x64
      - name: Download LLVM 12
        if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        run: curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.0/clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz"
      - name: Extract LLVM 12
        if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        run: tar -xf clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz && mkdir tests/llvm && mv clang+llvm-12.0.0-x86_64-apple-darwin/* tests/llvm
      - name: Get common iPhone OS 3.0 SDK fixtures
        run: cd "$GITHUB_WORKSPACE/tests" && curl -L https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-macOS-universal.tar.gz | tar xzv
      - name: Install the x86_64 macOS Rust target
        run: rustup target add x86_64-apple-darwin
      - name: Start host Cargo compile timer
        run: echo "HOST_CARGO_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Compile and run the library tests
        id: host-cargo-test
        run: cargo test --lib --target x86_64-apple-darwin
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
      - name: Report host Cargo compile time
        if: ${{ always() }}
        run: |
          elapsed=$(($(date +%s) - HOST_CARGO_STARTED_AT))
          echo "Host Cargo compile/test: ${elapsed}s"
          echo "- Cargo compile/test: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Measure host Cargo cache contents
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.cold_cargo_cache) && steps.host-cache-restore.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          total_kib=0
          for path in "$HOME/.cargo/registry" "$HOME/.cargo/git" "$CARGO_TARGET_DIR"; do
            if [[ -e "$path" ]]; then
              size_kib=$(du -sk "$path" | awk '{ print $1 }')
              total_kib=$((total_kib + size_kib))
              echo "$path: ${size_kib} KiB"
            fi
          done
          echo "Host Cargo cache uncompressed size: ${total_kib} KiB"
          echo "HOST_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "HOST_CACHE_SIZE_KIB=$total_kib" >> "$GITHUB_ENV"
      - name: Save host Cargo cache
        id: host-cache-save
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || !inputs.cold_cargo_cache) && steps.host-cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target/host
          key: ${{ steps.host-cache-restore.outputs.cache-primary-key }}
      - name: Report host Cargo cache save
        if: ${{ always() && steps.host-cargo-test.outcome == 'success' }}
        env:
          SAVE_OUTCOME: ${{ steps.host-cache-save.outcome }}
          CACHE_HIT: ${{ steps.host-cache-restore.outputs.cache-hit }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.cold_cargo_cache }}" == "true" ]]; then
            message="bypassed by cold_cargo_cache"
          elif [[ "$CACHE_HIT" == "true" ]]; then
            message="skipped for exact cache hit"
          elif [[ -n "${HOST_CACHE_SAVE_STARTED_AT:-}" ]]; then
            elapsed=$(($(date +%s) - HOST_CACHE_SAVE_STARTED_AT))
            message="${SAVE_OUTCOME}; ${elapsed}s; ${HOST_CACHE_SIZE_KIB:-unknown} KiB uncompressed"
          else
            message="not attempted"
          fi
          echo "Host Cargo cache save: $message"
          echo "- Cache save: $message" >> "$GITHUB_STEP_SUMMARY"

  native-reference-only:
    if: ${{ inputs.native_reference_only }}
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Native Foundation contract reference
        run: |
          cc tests/FoundationCopyDefaults.m -framework Foundation -o "$RUNNER_TEMP/foundation-contracts"
          "$RUNNER_TEMP/foundation-contracts"

  lint-and-test-macos:
    # The development branch uses the smaller preflight above. Preserve this
    # full historical job for the release branch, pull requests and manual
    # validation on other refs.
    if: ${{ !inputs.native_reference_only && github.ref != 'refs/heads/ci/unsigned-ipa-baseline' && github.ref != 'refs/heads/phase2/persistent-cold-start-index' }}

    # Tests already target x86_64; use its native pool after repeated ARM64
    # capacity cancellations. The arm64 iOS IPA workflow remains unchanged.
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install clang-format
        run: brew install clang-format
      - name: Native Foundation copy/defaults reference
        if: github.ref == 'refs/heads/ci/unsigned-ipa-baseline'
        run: |
          cc tests/FoundationCopyDefaults.m -framework Foundation -o "$RUNNER_TEMP/foundation-contracts"
          "$RUNNER_TEMP/foundation-contracts"
      - name: Check formatting
        if: github.ref == 'refs/heads/idared32bit'
        run: dev-scripts/format.sh --check
      - name: Try to get cached copy of cmake
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: vendor/cmake
          key: cmake_3_31_6_macos
      - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        name: Download Cmake
        run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
      - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        name: Extract Cmake
        run: tar xzvf "cmake-3.31.6-macos-universal.tar.gz" -C vendor && mv "vendor/cmake-3.31.6-macos-universal/CMake.app/Contents/" vendor/cmake && rm -rf vendor/cmake-3.31.6-macos-universal
      # This is the earliest point at which we can do linting: we don't need
      # LLVM until building tests.
      - name: Lint
        # The development branch carries historical warnings that newer
        # runner toolchains promote to errors. Record those diagnostics, but
        # still reach the test suite; release-branch lint remains strict.
        continue-on-error: ${{ github.ref == 'refs/heads/ci/unsigned-ipa-baseline' }}
        run: dev-scripts/lint.sh
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
      - name: Try to get cached copy of LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: tests/llvm
          key: llvm_12_0_0_macOS_x64
      - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Download LLVM
        run: curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.0/clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz"
      - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Extract LLVM
        run: tar -xf clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz && mkdir tests/llvm && mv clang+llvm-12.0.0-x86_64-apple-darwin/* tests/llvm
      - name: Get copy of common-3.0-sdk
        run: cd ${{ github.workspace }}/tests && curl -L https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-macOS-universal.tar.gz | tar xzv
      - name: Install x86_64 toolchain
        run: rustup target add x86_64-apple-darwin
      - name: Test library (development branch)
        if: github.ref == 'refs/heads/ci/unsigned-ipa-baseline'
        run: cargo test --lib --target x86_64-apple-darwin
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
      - name: Record diagnostic reproducer evidence
        if: github.ref == 'refs/heads/ci/unsigned-ipa-baseline'
        run: |
          cargo test --lib --target x86_64-apple-darwin object_history_preserves_collision_after_guest_zone_free_svc -- --nocapture
          cargo test --lib --target x86_64-apple-darwin flight_recorder_preserves_real_sysctl_failure_through_svc -- --nocapture
          cargo test --lib --target x86_64-apple-darwin diagnostic_missing_selector_preserves_failure_and_captures_caller -- --nocapture
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
      - name: Test
        if: github.ref == 'refs/heads/idared32bit'
        run: cargo test --target x86_64-apple-darwin
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
      # This step ensures that our non-iOS-specific tests are passing on macOS itself!
      - name: Sanity check tests
        if: github.ref == 'refs/heads/idared32bit'
        run: cc tests/TestApp_source/cli_tests.m tests/TestApp_source/CGAffineTransform.c tests/TestApp_source/SyncTester.m tests/TestApp_source/RespondsToSelector.m tests/TestApp_source/AutoReleasePoolTest.m tests/TestApp_source/Initialize.m -framework CoreFoundation -framework Foundation -framework CoreGraphics -DDEFINE_ME_WHEN_BUILDING_ON_MACOS -DTestApp_cli_tests_main=main -ObjC && ./a.out

  lint-and-test-win:
    if: ${{ !inputs.native_reference_only && !inputs.force_preflight_failure }}

    runs-on: windows-2022
    continue-on-error: ${{ github.ref == 'refs/heads/ci/unsigned-ipa-baseline' || github.ref == 'refs/heads/phase2/persistent-cold-start-index' }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    # Apparently the Windows runner already has clang-format? That's nice.
    - name: Check formatting
      if: github.ref == 'refs/heads/idared32bit'
      shell: bash # no command output without this
      run: dev-scripts/format.sh --check
    - name: Try to get cached copy of cmake
      id: cache-cmake
      uses: actions/cache@v4
      with:
        path: vendor/cmake
        key: cmake_3_31_6_windows
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Download Cmake
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip"
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Extract Cmake
      run: 7z -ovendor x "cmake-3.31.6-windows-x86_64.zip" && ren vendor\cmake-3.31.6-windows-x86_64 cmake
    # This is the earliest point at which we can do linting: we don't need
    # LLVM until building tests.
    - name: Lint
      continue-on-error: ${{ github.ref == 'refs/heads/ci/unsigned-ipa-baseline' || github.ref == 'refs/heads/phase2/persistent-cold-start-index' }}
      shell: bash # no command output without this
      run: dev-scripts/lint.sh
      env:
        CMAKE: ${{ github.workspace }}\vendor\cmake\bin\cmake
    - name: Try to get cached copy of LLVM
      id: cache-llvm
      uses: actions/cache@v4
      with:
        path: tests/llvm
        key: llvm_12_0_1_Windows_x64
    - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
      name: Download LLVM
      run: curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/LLVM-12.0.1-win64.exe"
    - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
      name: Extract LLVM
      run: 7z -otests/llvm x LLVM-12.0.1-win64.exe
    # Windows seems to break the stdout pipe for some reason
    - name: Get copy of common-3.0-sdk
      run: cd ${{ github.workspace }}/tests && curl -L --output ${{ runner.temp }}\sdk.tar.gz https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-windows-x86_64.tar.gz && tar xzvf ${{ runner.temp }}\sdk.tar.gz
    - name: Test library (development branch)
      if: github.ref == 'refs/heads/ci/unsigned-ipa-baseline' || github.ref == 'refs/heads/phase2/persistent-cold-start-index'
      run: cargo test --lib
      env:
        CMAKE: ${{ github.workspace }}\vendor\cmake\bin\cmake
    - name: Test
      if: github.ref == 'refs/heads/idared32bit'
      run: cargo test
      env:
        CMAKE: ${{ github.workspace }}\vendor\cmake\bin\cmake

  lint-android:
    if: ${{ !inputs.native_reference_only && !inputs.force_preflight_failure }}

    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref == 'refs/heads/ci/unsigned-ipa-baseline' || github.ref == 'refs/heads/phase2/persistent-cold-start-index' }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Check formatting
      if: github.ref == 'refs/heads/idared32bit'
      run: dev-scripts/format.sh --check
    - name: Try to get cached copy of cmake
      id: cache-cmake
      uses: actions/cache@v4
      with:
        path: vendor/cmake
        key: cmake_3_31_6_linux
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Download Cmake
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Extract Cmake
      run: tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake
    - name: Install AArch64 Android Rust toolchain
      run: rustup target add aarch64-linux-android
    - name: Install cargo-ndk
      run: cargo install cargo-ndk@3.5.4
    # The version must match the ndkVersion in android/app/build.gradle.kts.
    # The runner image usually has it already.
    - name: Install Android NDK r28c
      run: |
        if [ ! -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358" ]; then
          curl -L -o android-ndk-r28c-linux.zip "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          7z -oandroid-ndk -snld x android-ndk-r28c-linux.zip
          ln -s "$PWD/android-ndk/android-ndk-r28c" "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
        fi
    # Tests can't run on Android, so this is lint-only (clippy cross-compile).
    - name: Lint
      continue-on-error: ${{ github.ref == 'refs/heads/ci/unsigned-ipa-baseline' || github.ref == 'refs/heads/phase2/persistent-cold-start-index' }}
      run: dev-scripts/lint.sh ndk -t arm64-v8a
      env:
        # The version should match the ndkVersion defined in `android/app/build.gradle.kts`
        ANDROID_NDK_ROOT: '/usr/local/lib/android/sdk/ndk/28.2.13676358'
        ANDROID_NDK: '/usr/local/lib/android/sdk/ndk/28.2.13676358'
        ANDROID_NDK_HOME: '/usr/local/lib/android/sdk/ndk/28.2.13676358'
        CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

  build-unsigned-ipa:
    name: Build IPA after successful preflight
    needs: [candidate-scope, fast-preflight-macos]
    if: >-
      ${{
        always() &&
        needs.candidate-scope.result == 'success' &&
        needs.fast-preflight-macos.result == 'success' &&
        needs.candidate-scope.outputs.workflow_only != 'true' &&
        (github.event_name == 'push' || inputs.build_ipa)
      }}
    uses: ./.github/workflows/unsigned-ios-ipa.yml
    with:
      cold_cargo_cache: ${{ inputs.cold_cargo_cache || false }}
      artifact_role: ${{ inputs.artifact_role || 'replacement' }}
