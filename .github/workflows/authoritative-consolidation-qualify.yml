name: Authoritative consolidation qualification

on:
  workflow_dispatch:
  push:
    branches:
      - integration/dev249-qualified-consolidation-20261110

permissions:
  contents: read

concurrency:
  group: authoritative-consolidation-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target/host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 2

      - name: Verify exact consolidated candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object tests/TrenchesSelectorMutation_source/main.m)" = "c5c0406a36843f2682cac6434444c42d68c382c7"
          test "$(git hash-object tests/TrenchesSelectorMutation_headers/Foundation/Foundation.h)" = "72f7e78492919647a3776b423656ecc9f76c402a"
          test "$(shasum -a 256 tests/TrenchesSelectorMutation_headers/Foundation/Foundation.h | awk '{print $1}')" = "fcaf192a9ef6348ede1e92a4ed60a6d59fa657cbefdc5f3435ed8c35f6442161"
          test "$(git hash-object tests/TrenchesSelectorMutation.app/Info.plist)" = "dfc75ff756efc3252b1f8986872c584e4f6adf64"
          test "$(git hash-object tests/TrenchesSelectorMutation.app/PkgInfo)" = "6f749b0f376443ea266383322cc2d934f791bbee"
          test "$(jq -r .historical_accounting_base CONSOLIDATION_MANIFEST.json)" = "a950ac43aca0a2c14dd198e9e03955abb8092705"
          test "$(jq -r .source_commit_binding CONSOLIDATION_MANIFEST.json)" = "__SOURCE_COMMIT__"
          echo "QUALIFICATION_STATE=CONSOLIDATED_CANDIDATE" | tee -a "$GITHUB_ENV"

      - name: Restore CMake 3.31.6
        id: cache-cmake
        uses: actions/cache/restore@v4
        with:
          path: vendor/cmake
          key: cmake_3_31_6_macos
      - name: Download CMake 3.31.6 on cache miss
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
      - name: Extract CMake 3.31.6 on cache miss
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: tar xzf cmake-3.31.6-macos-universal.tar.gz -C vendor && mv vendor/cmake-3.31.6-macos-universal/CMake.app/Contents vendor/cmake && rm -rf vendor/cmake-3.31.6-macos-universal

      - name: Restore LLVM 12
        id: cache-llvm
        uses: actions/cache/restore@v4
        with:
          path: tests/llvm
          key: llvm_12_0_0_macOS_x64
      - name: Download LLVM 12 on cache miss
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.0/clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz"
      - name: Extract LLVM 12 on cache miss
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: tar -xf clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz && mkdir tests/llvm && mv clang+llvm-12.0.0-x86_64-apple-darwin/* tests/llvm

      - name: Restore host Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target/host
          key: authoritative-consolidation-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            authoritative-consolidation-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', '.cargo/config.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Get established common iPhone OS 3.0 SDK fixtures
        run: cd "$GITHUB_WORKSPACE/tests" && curl -L https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-macOS-universal.tar.gz | tar xz
      - name: Install the existing x86_64 macOS Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Run focused selector ownership and unwind controls
        id: focused-controls
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib trenches_selector_snapshot --target x86_64-apple-darwin -- --nocapture 2>&1 | tee trenches-focused-controls.log
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

      - name: Run exact guest Objective-C contract
        id: guest-contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --test integration trenches_selector_mutation_contract --target x86_64-apple-darwin -- --exact --nocapture 2>&1 | tee trenches-guest-contract.log
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

      - name: Run complete library regression suite
        id: library-regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --lib --target x86_64-apple-darwin 2>&1 | tee trenches-library-regressions.log
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

      - name: Write bounded run manifest
        if: always()
        shell: bash
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "qualification_state=${QUALIFICATION_STATE:-UNKNOWN}"
            echo "source_changed=true"
            echo "foundation_blob=$(git hash-object src/frameworks/foundation/ns_array.rs)"
            echo "integration_blob=$(git hash-object tests/integration.rs)"
            echo "security_blob=$(git hash-object src/frameworks/security/sec_item.rs)"
            echo "reachability_blob=$(git hash-object src/frameworks/system_configuration/sc_network_reachability.rs)"
            echo "options_blob=$(git hash-object src/options.rs)"
            echo "consolidation_manifest_sha256=$(shasum -a 256 CONSOLIDATION_MANIFEST.json | awk '{print $1}')"
            echo "fixture_source_blob=c5c0406a36843f2682cac6434444c42d68c382c7"
            echo "fixture_header_blob=72f7e78492919647a3776b423656ecc9f76c402a"
            echo "fixture_header_sha256=fcaf192a9ef6348ede1e92a4ed60a6d59fa657cbefdc5f3435ed8c35f6442161"
            echo "fixture_header_route=fixture_owned_declaration_only"
            echo "harness_classifier_outcome=not_run_established_tr_hr1"
            echo "full_testapp_outcome=not_run_decoupled_route"
            echo "focused_controls_outcome=${{ steps.focused-controls.outcome }}"
            echo "guest_contract_outcome=${{ steps.guest-contract.outcome }}"
            echo "library_regressions_outcome=${{ steps.library-regressions.outcome }}"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "cmake_cache_hit=${{ steps.cache-cmake.outputs.cache-hit }}"
            echo "llvm_cache_hit=${{ steps.cache-llvm.outputs.cache-hit }}"
            echo "cargo_cache_hit=${{ steps.cargo-cache.outputs.cache-hit }}"
          } > trenches-run-manifest.txt
          cat trenches-run-manifest.txt

      - name: Adjudicate bounded green candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.focused-controls.outcome }}" = "success"
          test "${{ steps.guest-contract.outcome }}" = "success"
          test "${{ steps.library-regressions.outcome }}" = "success"

  windows-artifact:
    needs: qualification
    uses: ./.github/workflows/authoritative-consolidation-windows.yml
