name: Development 2.51 unsigned IPA live transfer

on:
  workflow_dispatch:
  push:
    branches:
      - packaging/development-2.51-delivery-20261110

permissions:
  contents: read
  statuses: write

concurrency:
  group: development-251-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  DEV_BUNDLE_ID: com.bookieart1.idared32bit.dev
  DEV_DISPLAY_NAME: iDared Dev 2.51
  SOURCE_COMMIT: 62ac6d68038f90c97f45acde74ad9dddeb59047a

jobs:
  build-package-live-transfer:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      IOS_CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target/ios
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62ac6d68038f90c97f45acde74ad9dddeb59047a
          submodules: recursive
          fetch-depth: 1

      - name: Verify exact Development 2.51 source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(jq -r .historical_accounting_base CONSOLIDATION_MANIFEST.json)" = "a950ac43aca0a2c14dd198e9e03955abb8092705"
          test "$(jq -r .source_commit_binding CONSOLIDATION_MANIFEST.json)" = "__SOURCE_COMMIT__"
          test "$(jq -r .manifest_id CONSOLIDATION_MANIFEST.json)" = "IDARED-DEVELOPMENT-2.51-UNIVERSAL-CONTRACTS-20261110"
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Install iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Restore iOS Cargo inputs without saving
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target/ios
          key: authoritative-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', '.cargo/config.toml') }}-62ac6d68038f90c97f45acde74ad9dddeb59047a
          restore-keys: |
            authoritative-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', '.cargo/config.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore CMake 3.31.6 without saving
        id: cmake-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/cmake
          key: cmake-3.31.6-macos-universal

      - name: Acquire recorded CMake input on miss
        if: steps.cmake-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --output "$RUNNER_TEMP/cmake.tgz" "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
          tar xzf "$RUNNER_TEMP/cmake.tgz" -C vendor
          mv vendor/cmake-3.31.6-macos-universal/CMake.app/Contents vendor/cmake

      - name: Build unsigned consolidated archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iphone/iDared32bit.xcodeproj \
            -scheme "iDared 32bit" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iDared-Dev-2.51.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$DEV_BUNDLE_ID" \
            INFOPLIST_KEY_CFBundleDisplayName="$DEV_DISPLAY_NAME" \
            INFOPLIST_KEY_CFBundleName="$DEV_DISPLAY_NAME" \
            CURRENT_PROJECT_VERSION=251 \
            MARKETING_VERSION=2.51 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CARGO_TARGET_DIR="$IOS_CARGO_TARGET_DIR"

      - name: Bind manifest, verify, and package
        id: package
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/iDared-Dev-2.51.xcarchive"
          APP="$ARCHIVE/Products/Applications/iDared 32bit.app"
          BINARY="$APP/iDared 32bit"
          OUT="$RUNNER_TEMP/consolidated-transfer"
          mkdir -p "$OUT/Payload" "$OUT/symbols"
          jq --arg commit "$SOURCE_COMMIT" --arg workflow "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '.source_commit_binding=$commit | .workflow_commit=$workflow | .workflow_run=$run' \
            CONSOLIDATION_MANIFEST.json > "$APP/ConsolidationManifest.json"
          test "$(jq -r .source_commit_binding "$APP/ConsolidationManifest.json")" = "$SOURCE_COMMIT"
          test "$(jq -r .workflow_commit "$APP/ConsolidationManifest.json")" = "$GITHUB_SHA"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "$DEV_BUNDLE_ID"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist")" = "$DEV_DISPLAY_NAME"
          test "$(plutil -extract CFBundleVersion raw "$APP/Info.plist")" = "251"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")" = "2.51"
          test ! -e "$APP/embedded.mobileprovision"
          ! codesign -dv "$APP" >/dev/null 2>&1
          test -z "$(find "$APP" -type f -iname '*.ipa' -print -quit)"
          archs="$(lipo -archs "$BINARY")"
          echo "$archs" | grep -qw arm64
          cp -R "$APP" "$OUT/Payload/"
          (cd "$OUT" && /usr/bin/zip -qry iDared-Dev-2.51-unsigned.ipa Payload)
          cp -R "$ARCHIVE/dSYMs" "$OUT/symbols/"
          dwarfdump --uuid "$BINARY" > "$OUT/binary-uuid.txt"
          find "$OUT/symbols/dSYMs" -name '*.dSYM' -exec dwarfdump --uuid {} \; > "$OUT/dsym-uuids.txt"
          binary_uuid="$(awk 'NR==1 {print $2}' "$OUT/binary-uuid.txt")"
          grep -q "$binary_uuid" "$OUT/dsym-uuids.txt"
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "workflow_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "bundle_id=$DEV_BUNDLE_ID"
            echo "display_name=$DEV_DISPLAY_NAME"
            echo "architecture=$archs"
            echo "unsigned=true"
            echo "provisioning_profile=absent"
            echo "guest_ipas=absent"
            shasum -a 256 "$OUT/iDared-Dev-2.51-unsigned.ipa"
            shasum -a 256 "$APP/ConsolidationManifest.json"
            cat "$OUT/binary-uuid.txt"
            cat "$OUT/dsym-uuids.txt"
          } > "$OUT/package-manifest.txt"
          (cd "$OUT" && /usr/bin/zip -qry iDared-Dev-2.51-native-symbols.zip symbols binary-uuid.txt dsym-uuids.txt package-manifest.txt)
          shasum -a 256 "$OUT/iDared-Dev-2.51-native-symbols.zip" >> "$OUT/package-manifest.txt"
          cat "$OUT/package-manifest.txt"

      - name: Serve IPA, symbols, and manifest through bounded ephemeral HTTPS routes
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/consolidated-transfer"
          IPA="$OUT/iDared-Dev-2.51-unsigned.ipa"
          SYMBOLS="$OUT/iDared-Dev-2.51-native-symbols.zip"
          MANIFEST="$OUT/package-manifest.txt"
          TOKEN="$(openssl rand -hex 32)"
          PORT="$((22000 + RANDOM % 18000))"
          cat > "$RUNNER_TEMP/serve-three.py" <<'PY'
          import http.server, os, sys
          port=int(sys.argv[1]); token=sys.argv[2]; ipa=sys.argv[3]; symbols=sys.argv[4]; manifest=sys.argv[5]; sentinel=sys.argv[6]
          routes={
              f'/{token}/iDared-Dev-2.51-unsigned.ipa':ipa,
              f'/{token}/iDared-Dev-2.51-native-symbols.zip':symbols,
              f'/{token}/package-manifest.txt':manifest,
          }
          done=set()
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  path=routes.get(self.path)
                  if path is None:
                      self.send_response(404); self.send_header('Cache-Control','no-store'); self.end_headers(); return
                  self.send_response(200); self.send_header('Content-Type','application/octet-stream'); self.send_header('Cache-Control','no-store, max-age=0'); self.send_header('Content-Length',str(os.path.getsize(path))); self.end_headers()
                  with open(path,'rb') as f:
                      while True:
                          b=f.read(1024*1024)
                          if not b: break
                          self.wfile.write(b)
                  done.add(self.path)
                  if len(done)==3: open(sentinel,'w').write('complete')
              def log_message(self, fmt, *args): print(fmt%args, flush=True)
          http.server.ThreadingHTTPServer(('127.0.0.1',port),H).serve_forever()
          PY
          python3 "$RUNNER_TEMP/serve-three.py" "$PORT" "$TOKEN" "$IPA" "$SYMBOLS" "$MANIFEST" "$RUNNER_TEMP/transfer-complete" > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$TUNNEL_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in {1..30}; do nc -z 127.0.0.1 "$PORT" && break; sleep 1; done
          nc -z 127.0.0.1 "$PORT"

          RELEASE_JSON="$RUNNER_TEMP/cloudflared-release.json"
          curl --fail --location "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/2026.10.7" -o "$RELEASE_JSON"
          ASSET_NAME=cloudflared-darwin-amd64.tgz
          ASSET_URL="$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name==$name) | .browser_download_url' "$RELEASE_JSON")"
          ASSET_DIGEST="$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name==$name) | .digest' "$RELEASE_JSON")"
          test -n "$ASSET_URL"; test "$ASSET_URL" != null
          case "$ASSET_DIGEST" in sha256:*) ;; *) echo "Official asset digest unavailable"; exit 1;; esac
          curl --fail --location "$ASSET_URL" -o "$RUNNER_TEMP/cloudflared.tgz"
          ACTUAL_DIGEST="sha256:$(shasum -a 256 "$RUNNER_TEMP/cloudflared.tgz" | awk '{print $1}')"
          test "$ACTUAL_DIGEST" = "$ASSET_DIGEST"
          tar xzf "$RUNNER_TEMP/cloudflared.tgz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --url "http://127.0.0.1:$PORT" > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          TUNNEL_PID=$!
          ORIGIN=""
          for _ in {1..90}; do
            ORIGIN="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -n1 || true)"
            test -n "$ORIGIN" && break
            kill -0 "$TUNNEL_PID"
            sleep 1
          done
          test -n "$ORIGIN"
          echo "CONSOLIDATED_IPA_TRANSFER_BEGIN"
          IPA_SHA="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          IPA_SIZE="$(stat -f %z "$IPA")"
          SYMBOLS_SHA="$(shasum -a 256 "$SYMBOLS" | awk '{print $1}')"
          SYMBOLS_SIZE="$(stat -f %z "$SYMBOLS")"
          MANIFEST_SHA="$(shasum -a 256 "$MANIFEST" | awk '{print $1}')"
          MANIFEST_SIZE="$(stat -f %z "$MANIFEST")"
          IPA_URL="$ORIGIN/$TOKEN/iDared-Dev-2.51-unsigned.ipa"
          SYMBOLS_URL="$ORIGIN/$TOKEN/iDared-Dev-2.51-native-symbols.zip"
          MANIFEST_URL="$ORIGIN/$TOKEN/package-manifest.txt"
          echo "source_commit=$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA"
          echo "ipa_sha256=$IPA_SHA"
          echo "ipa_size=$IPA_SIZE"
          echo "symbols_sha256=$SYMBOLS_SHA"
          echo "symbols_size=$SYMBOLS_SIZE"
          echo "manifest_sha256=$MANIFEST_SHA"
          echo "manifest_size=$MANIFEST_SIZE"
          echo "cloudflared_digest=$ACTUAL_DIGEST"
          echo "IPA_URL=$IPA_URL"
          echo "SYMBOLS_URL=$SYMBOLS_URL"
          echo "MANIFEST_URL=$MANIFEST_URL"
          publish_status() {
            local context="$1" url="$2" description="$3" state="${4:-pending}"
            jq -n \
              --arg state "$state" \
              --arg target_url "$url" \
              --arg description "$description" \
              --arg context "$context" \
              '{state:$state,target_url:$target_url,description:$description,context:$context}' \
              | curl --fail --silent --show-error \
                  -X POST \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
                  --data-binary @- >/dev/null
          }
          publish_status "development-2.51-transfer/ipa" "$IPA_URL" "sha256=$IPA_SHA size=$IPA_SIZE"
          publish_status "development-2.51-transfer/symbols" "$SYMBOLS_URL" "sha256=$SYMBOLS_SHA size=$SYMBOLS_SIZE"
          publish_status "development-2.51-transfer/manifest" "$MANIFEST_URL" "sha256=$MANIFEST_SHA size=$MANIFEST_SIZE"
          echo "::notice title=Development 2.51 transfer::IPA_URL=$IPA_URL%0ASYMBOLS_URL=$SYMBOLS_URL%0AMANIFEST_URL=$MANIFEST_URL%0AIPA_SHA256=$IPA_SHA%0AIPA_SIZE=$IPA_SIZE%0ASYMBOLS_SHA256=$SYMBOLS_SHA%0ASYMBOLS_SIZE=$SYMBOLS_SIZE%0AMANIFEST_SHA256=$MANIFEST_SHA%0AMANIFEST_SIZE=$MANIFEST_SIZE%0ASOURCE_COMMIT=$SOURCE_COMMIT%0AWORKFLOW_COMMIT=$GITHUB_SHA"
          echo "CONSOLIDATED_IPA_TRANSFER_END"
          deadline=$((SECONDS+600))
          while [[ ! -f "$RUNNER_TEMP/transfer-complete" && $SECONDS -lt $deadline ]]; do
            kill -0 "$SERVER_PID"; kill -0 "$TUNNEL_PID"; sleep 2
          done
          test -f "$RUNNER_TEMP/transfer-complete"
          kill "$TUNNEL_PID" "$SERVER_PID" 2>/dev/null || true
          wait "$TUNNEL_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          publish_status "development-2.51-transfer/ipa" "$IPA_URL" "transfer complete; sha256=$IPA_SHA" success
          publish_status "development-2.51-transfer/symbols" "$SYMBOLS_URL" "transfer complete; sha256=$SYMBOLS_SHA" success
          publish_status "development-2.51-transfer/manifest" "$MANIFEST_URL" "transfer complete; sha256=$MANIFEST_SHA" success
          echo "tunnel_stopped=true"
          echo "server_stopped=true"

      - name: Print zero-storage boundary
        if: always()
        run: |
          echo "source_commit=$SOURCE_COMMIT"
          echo "workflow_commit=$GITHUB_SHA"
          echo "run_id=$GITHUB_RUN_ID"
          echo "ios_cache_hit=${{ steps.ios-cache.outputs.cache-hit }}"
          echo "cmake_cache_hit=${{ steps.cmake-cache.outputs.cache-hit }}"
          echo "cache_save=none"
          echo "artifact_upload=none"
          echo "release_upload=none"
