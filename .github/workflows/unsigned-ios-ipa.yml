name: Build unsigned development IPA

# Compatibility-test builds are intentionally produced only from the dedicated
# development branch below and install beside the App Store application.

on:
  # Ordinary development pushes reach this workflow only after the caller's
  # fast macOS preflight succeeds. Manual runs remain available for preserved
  # milestone/recovery builds.
  workflow_call:
    inputs:
      cold_cargo_cache:
        description: Bypass Cargo cache restore/save for a diagnostic cold run
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cold_cargo_cache:
        description: Bypass Cargo cache restore/save for a diagnostic cold run
        required: false
        type: boolean
        default: false

# This workflow only needs to read the repository and upload its build artifact.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
  # macOS 15 currently carries Xcode 26.3 alongside its older default. Pin it
  # explicitly so the app keeps the iOS 26 SDK without depending on the much
  # smaller macOS 26 runner pool.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  # These are command-line build overrides only. The Xcode project keeps its
  # original App Store identity, while this development IPA installs beside it.
  DEV_BUNDLE_ID: com.bookieart1.idared32bit.dev
  DEV_DISPLAY_NAME: iDared Dev
  # Dev 2.37 restores the ordinary iOS Cargo cache, then forcibly rebuilds its
  # patched native SDL dependency. Never save that custom output into the
  # ordinary iOS cache.
  IDARED_SDL_DIAGNOSTIC: "1"

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA on macOS
    # The app uses SwiftUI APIs from the iOS 26 SDK. Pin Xcode 26.3 above while
    # using the Intel macOS 15 pool: the generic macOS 15 pool cancelled both
    # Dev 2.17 attempts after 15 minutes without assigning a runner, while the
    # Intel pool completed the matching hosted library tests and carries the
    # same pinned Xcode/SDK according to GitHub's runner-image inventory.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      IOS_CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target/ios

    steps:
      - name: Check out the fork
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 1

      - name: Verify the exact candidate commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Show build tools
        run: |
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Identify the iOS Rust cache boundary
        id: ios-build-environment
        run: |
          set -euo pipefail
          rust_release="$(rustc -vV | awk '/^release:/ { print $2 }')"
          xcode_build="$(xcodebuild -version | awk '/Build version/ { print $3 }')"
          sdk_build="$(xcrun --sdk iphoneos --show-sdk-build-version)"
          test -n "$rust_release"
          test -n "$xcode_build"
          test -n "$sdk_build"
          {
            echo "rust_release=$rust_release"
            echo "xcode_build=$xcode_build"
            echo "sdk_build=$sdk_build"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Install the iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Start iOS Cargo cache restore timer
        if: ${{ !inputs.cold_cargo_cache }}
        run: echo "IOS_CACHE_RESTORE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Restore iOS release Cargo cache
        id: ios-cache-restore
        if: ${{ !inputs.cold_cargo_cache }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target/ios
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.ios-build-environment.outputs.rust_release }}-aarch64-apple-ios-release-default-xcode-${{ steps.ios-build-environment.outputs.xcode_build }}-sdk-${{ steps.ios-build-environment.outputs.sdk_build }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.ios-build-environment.outputs.rust_release }}-aarch64-apple-ios-release-default-xcode-${{ steps.ios-build-environment.outputs.xcode_build }}-sdk-${{ steps.ios-build-environment.outputs.sdk_build }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/Cargo.toml', '.cargo/config.toml') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.ios-build-environment.outputs.rust_release }}-aarch64-apple-ios-release-default-xcode-${{ steps.ios-build-environment.outputs.xcode_build }}-sdk-${{ steps.ios-build-environment.outputs.sdk_build }}-

      - name: Report iOS Cargo cache restore
        if: ${{ always() && !inputs.cold_cargo_cache }}
        env:
          CACHE_HIT: ${{ steps.ios-cache-restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.ios-cache-restore.outputs.cache-matched-key }}
          PRIMARY_KEY: ${{ steps.ios-cache-restore.outputs.cache-primary-key }}
          RESTORE_OUTCOME: ${{ steps.ios-cache-restore.outcome }}
        run: |
          set -euo pipefail
          elapsed=$(($(date +%s) - IOS_CACHE_RESTORE_STARTED_AT))
          if [[ "$RESTORE_OUTCOME" != "success" ]]; then
            status="restore-error (cold recovery)"
            rm -rf "$IOS_CARGO_TARGET_DIR" "$HOME/.cargo/registry" "$HOME/.cargo/git"
          elif [[ "$CACHE_HIT" == "true" ]]; then
            status="exact-hit"
          elif [[ -n "$MATCHED_KEY" ]]; then
            status="restore-prefix-hit"
          else
            status="miss"
          fi
          echo "iOS Cargo cache: $status; restore ${elapsed}s"
          echo "Requested key: $PRIMARY_KEY"
          echo "Matched key: ${MATCHED_KEY:-<none>}"
          {
            echo "### iOS Cargo cache restore"
            echo "- Status: $status"
            echo "- Duration: ${elapsed}s"
            echo "- Requested: \`$PRIMARY_KEY\`"
            echo "- Matched: \`${MATCHED_KEY:-<none>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve and patch the actual iPhone sdl2-sys SDL source
        id: diagnostic-sdl
        run: bash iphone/diagnostics/prepare-dev235-diagnostic-sdl.sh

      # A restored target cache may contain sdl2-sys output compiled from the
      # unmodified nested SDL checkout. Clean only this native dependency; its
      # dependents relink normally while unrelated Rust artifacts stay warm.
      # The final executable checks below are the authoritative proof.
      - name: Force the corrected native SDL dependency to rebuild
        run: |
          set -euo pipefail
          cargo clean \
            --package sdl2-sys \
            --release \
            --target aarch64-apple-ios \
            --target-dir "$IOS_CARGO_TARGET_DIR"

      # SDL's current CMake project still needs the pre-CMake-4 compatibility
      # mode. This is the same known-good CMake release used by the repository's
      # existing macOS lint/test workflow.
      - name: Restore CMake 3.31.6
        id: cache-cmake
        uses: actions/cache@v6
        with:
          path: vendor/cmake
          key: cmake-3.31.6-macos-universal

      - name: Download CMake 3.31.6
        if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --fail --location \
            --output "$RUNNER_TEMP/cmake-3.31.6.tar.gz" \
            "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
          tar xzf "$RUNNER_TEMP/cmake-3.31.6.tar.gz" -C vendor
          mv vendor/cmake-3.31.6-macos-universal/CMake.app/Contents vendor/cmake

      - name: Verify CMake version
        run: |
          "$CMAKE" --version

      - name: Build the separate iDared Dev app without signing
        id: ios-archive
        run: |
          set -euo pipefail
          started_at=$(date +%s)
          xcodebuild archive \
            -project iphone/iDared32bit.xcodeproj \
            -scheme "iDared 32bit" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iDared32bit.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$DEV_BUNDLE_ID" \
            INFOPLIST_KEY_CFBundleDisplayName="$DEV_DISPLAY_NAME" \
            INFOPLIST_KEY_CFBundleName="$DEV_DISPLAY_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CARGO_TARGET_DIR="$IOS_CARGO_TARGET_DIR" \
            2>&1 | tee "$RUNNER_TEMP/idared-xcodebuild.log"
          elapsed=$(($(date +%s) - started_at))
          echo "Xcode archive (including nested iOS Cargo release build): ${elapsed}s"
          cargo_summary="$(grep -E 'Finished .*release.* in ' "$RUNNER_TEMP/idared-xcodebuild.log" | tail -n 1 || true)"
          echo "Nested Cargo summary: ${cargo_summary:-not emitted by this Xcode build}"
          {
            echo "### iOS archive timing"
            echo "- Xcode archive including Cargo: ${elapsed}s"
            echo "- Nested Cargo: ${cargo_summary:-not emitted by this Xcode build}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Dev 2.37 first-frame orientation gate in the linked app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/iDared32bit.xcarchive/Products/Applications/iDared 32bit.app"
          EXECUTABLE_NAME="$(plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist")"
          EXECUTABLE="$APP_PATH/$EXECUTABLE_NAME"
          iphone/diagnostics/verify-dev237-linked-app.sh \
            "$EXECUTABLE" "$RUNNER_TEMP"

          clean_build_log="$RUNNER_TEMP/idared-xcodebuild-no-ansi.log"
          /usr/bin/perl -pe 's/\e\[[0-9;]*[mK]//g' \
            "$RUNNER_TEMP/idared-xcodebuild.log" > "$clean_build_log"
          grep -Eq 'Running .*/sdl2-sys-[^/]*/build-script-build' "$clean_build_log"
          grep -Fq 'the dependency `sdl2-sys` was rebuilt' "$clean_build_log"
          echo "Confirmed the sdl2-sys native build script ran and its Rust dependent rebuilt."

          verified_markers_file="$RUNNER_TEMP/idared-dev237-linked-markers.txt"
          marker_count="$(wc -l < "$verified_markers_file" | tr -d ' ')"
          test "$marker_count" = 15

          mkdir -p build/diagnostic-provenance
          {
            echo "app_commit=$GITHUB_SHA"
            echo "sdl2_sys_source=git+https://github.com/iDared32bit-emu/rust-sdl2?branch=touchhle-ios-host#${{ steps.diagnostic-sdl.outputs.rust_sdl2_commit }}"
            echo "sdl2_sys_manifest=${{ steps.diagnostic-sdl.outputs.sdl2_sys_manifest }}"
            echo "bundled_sdl_base=${{ steps.diagnostic-sdl.outputs.sdl_base_commit }}"
            echo "bundled_sdl_diagnostic=${{ steps.diagnostic-sdl.outputs.sdl_diagnostic_commit }}"
            echo "diagnostic_bundle_sha256=${{ steps.diagnostic-sdl.outputs.bundle_sha256 }}"
            echo "diagnostic_bridge_patch_blob=${{ steps.diagnostic-sdl.outputs.bridge_patch_blob }}"
            echo "diagnostic_bridge_patch_sha256=${{ steps.diagnostic-sdl.outputs.bridge_patch_sha256 }}"
            echo "scene_policy_patch_blob=${{ steps.diagnostic-sdl.outputs.scene_policy_patch_blob }}"
            echo "scene_policy_patch_sha256=${{ steps.diagnostic-sdl.outputs.scene_policy_patch_sha256 }}"
            echo "first_frame_gate_patch_blob=${{ steps.diagnostic-sdl.outputs.first_frame_gate_patch_blob }}"
            echo "first_frame_gate_patch_sha256=${{ steps.diagnostic-sdl.outputs.first_frame_gate_patch_sha256 }}"
            sed 's/^/linked_marker=/' "$verified_markers_file"
          } | tee build/diagnostic-provenance/identity.txt

          {
            echo "### Dev 2.37 native SDL provenance"
            echo "- rust-sdl2: \`${{ steps.diagnostic-sdl.outputs.rust_sdl2_commit }}\`"
            echo "- bundled SDL base: \`${{ steps.diagnostic-sdl.outputs.sdl_base_commit }}\`"
            echo "- bundled SDL diagnostic: \`${{ steps.diagnostic-sdl.outputs.sdl_diagnostic_commit }}\`"
            echo "- Diagnostic bridge patch blob: \`${{ steps.diagnostic-sdl.outputs.bridge_patch_blob }}\`"
            echo "- Diagnostic bridge patch SHA-256: \`${{ steps.diagnostic-sdl.outputs.bridge_patch_sha256 }}\`"
            echo "- Scene-policy patch blob: \`${{ steps.diagnostic-sdl.outputs.scene_policy_patch_blob }}\`"
            echo "- Scene-policy patch SHA-256: \`${{ steps.diagnostic-sdl.outputs.scene_policy_patch_sha256 }}\`"
            echo "- First-frame gate patch blob: \`${{ steps.diagnostic-sdl.outputs.first_frame_gate_patch_blob }}\`"
            echo "- First-frame gate patch SHA-256: \`${{ steps.diagnostic-sdl.outputs.first_frame_gate_patch_sha256 }}\`"
            echo "- Native rebuild: sdl2-sys build script and dependent rebuild observed"
            echo "- Linked markers: $marker_count of $marker_count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify separate identity and package the unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/iDared32bit.xcarchive/Products/Applications/iDared 32bit.app"
          ACTUAL_BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")"
          ACTUAL_DISPLAY_NAME="$(plutil -extract CFBundleDisplayName raw "$APP_PATH/Info.plist")"

          test -d "$APP_PATH"
          test "$ACTUAL_BUNDLE_ID" = "$DEV_BUNDLE_ID"
          test "$ACTUAL_DISPLAY_NAME" = "$DEV_DISPLAY_NAME"
          test ! -e "$APP_PATH/embedded.mobileprovision"

          if codesign -dv "$APP_PATH" >/dev/null 2>&1; then
            echo "The app was unexpectedly signed."
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          (
            cd build
            /usr/bin/zip -qry iDared32bit-dev-unsigned.ipa Payload
          )

          test -s build/iDared32bit-dev-unsigned.ipa
          shasum -a 256 build/iDared32bit-dev-unsigned.ipa

      - name: Upload the separate unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: iDared32bit-dev-unsigned-${{ github.sha }}
          path: build/iDared32bit-dev-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Preserve native crash symbol identity
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/iDared32bit.xcarchive"
          mkdir -p build/native-symbols
          cp -R "$ARCHIVE/dSYMs" build/native-symbols/
          test -n "$(find build/native-symbols/dSYMs -name '*.dSYM' -print -quit)"
          {
            echo "commit=$GITHUB_SHA"
            echo "workflow=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            dwarfdump --uuid "$ARCHIVE/Products/Applications/iDared 32bit.app/iDared 32bit"
            find build/native-symbols/dSYMs -name '*.dSYM' -exec dwarfdump --uuid {} \;
          } > build/native-symbols/identity.txt
          cat build/native-symbols/identity.txt

      - name: Upload native crash symbols
        uses: actions/upload-artifact@v7
        with:
          name: iDared32bit-native-symbols-${{ github.sha }}
          path: build/native-symbols/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Dev 2.37 native SDL provenance
        uses: actions/upload-artifact@v7
        with:
          name: iDared32bit-diagnostic-provenance-${{ github.sha }}
          path: build/diagnostic-provenance/
          if-no-files-found: error
          retention-days: 90

      - name: Measure iOS Cargo cache contents
        if: ${{ success() && env.IDARED_SDL_DIAGNOSTIC != '1' && !inputs.cold_cargo_cache && steps.ios-cache-restore.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          total_kib=0
          for path in "$HOME/.cargo/registry" "$HOME/.cargo/git" "$IOS_CARGO_TARGET_DIR"; do
            if [[ -e "$path" ]]; then
              size_kib=$(du -sk "$path" | awk '{ print $1 }')
              total_kib=$((total_kib + size_kib))
              echo "$path: ${size_kib} KiB"
            fi
          done
          echo "iOS Cargo cache uncompressed size: ${total_kib} KiB"
          echo "IOS_CACHE_SAVE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "IOS_CACHE_SIZE_KIB=$total_kib" >> "$GITHUB_ENV"

      - name: Save iOS release Cargo cache
        id: ios-cache-save
        if: ${{ success() && env.IDARED_SDL_DIAGNOSTIC != '1' && !inputs.cold_cargo_cache && steps.ios-cache-restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target/ios
          key: ${{ steps.ios-cache-restore.outputs.cache-primary-key }}

      - name: Report iOS Cargo cache save
        if: ${{ always() && steps.ios-archive.outcome == 'success' }}
        env:
          SAVE_OUTCOME: ${{ steps.ios-cache-save.outcome }}
          CACHE_HIT: ${{ steps.ios-cache-restore.outputs.cache-hit }}
        run: |
          if [[ "${{ inputs.cold_cargo_cache }}" == "true" ]]; then
            message="bypassed by cold_cargo_cache"
          elif [[ "$IDARED_SDL_DIAGNOSTIC" == "1" ]]; then
            message="not saved; Dev 2.37 custom native SDL output is intentionally isolated"
          elif [[ "$CACHE_HIT" == "true" ]]; then
            message="skipped for exact cache hit"
          elif [[ -n "${IOS_CACHE_SAVE_STARTED_AT:-}" ]]; then
            elapsed=$(($(date +%s) - IOS_CACHE_SAVE_STARTED_AT))
            message="${SAVE_OUTCOME}; ${elapsed}s; ${IOS_CACHE_SIZE_KIB:-unknown} KiB uncompressed"
          else
            message="not attempted"
          fi
          echo "iOS Cargo cache save: $message"
          echo "- Cache save: $message" >> "$GITHUB_STEP_SUMMARY"
